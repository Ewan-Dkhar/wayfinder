[project]
name = "wayfinder"
version = "0.1.0"
description = "In-game tactical combat HUD powered by local SLMs and SQLite FTS5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "yt-dlp>=2026.8.19",
    "faster-whisper>=1.0.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
